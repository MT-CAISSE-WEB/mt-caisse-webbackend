<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reçu de Caisse - {{societe}}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Arial", "Helvetica", sans-serif;
        font-size: 10px; /* Légèrement réduit pour plus de compacité */
        color: #000;
        background: #ffffff;
        line-height: 1.25;
      }

      .page {
        width: 210mm;
        min-height: 297mm;
        /* RÉDUIT AU MAXIMUM : colle le contenu aux bordures du cadre */
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        border: 1px solid #000;
        display: flex;
        flex-direction: column;
      }

      /* ==================== EN-TÊTE ==================== */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid #000;
        padding-bottom: 4px; /* Réduit */
        margin-bottom: 6px; /* Réduit */
        flex-shrink: 0;
      }

      .header-left {
        display: flex;
        gap: 8px; /* Réduit */
        align-items: flex-start;
      }

      .header-initial {
        font-size: 24px; /* Réduit */
        font-weight: bold;
        border: 2px solid #000;
        width: 40px; /* Réduit */
        height: 40px; /* Réduit */
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .company-info {
        flex: 1;
        padding-top: 2px;
      }

      .company-name {
        font-size: 12px; /* Réduit */
        font-weight: bold;
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .company-site {
        font-size: 10px; /* Réduit */
        font-style: italic;
      }

      .header-right {
        text-align: left;
      }

      .receipt-title {
        font-size: 18px; /* Réduit */
        font-weight: bold;
        text-transform: uppercase;
        margin-bottom: 6px; /* Réduit */
        text-align: left;
      }

      .receipt-info-grid {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px; /* Réduit */
        margin-top: 6px; /* Réduit */
      }

      .receipt-info-row {
        display: flex;
        align-items: baseline;
        gap: 6px; /* Réduit */
      }

      .receipt-info-label {
        font-weight: bold;
        font-size: 10px;
        text-align: left;
        min-width: auto;
      }

      .receipt-info-value {
        border-bottom: 1px solid #000;
        min-width: 130px; /* Réduit */
        padding-left: 4px;
        font-size: 10px;
      }

      /* ==================== MONTANT PRINCIPAL ==================== */
      .main-amount {
        text-align: right;
        font-size: 15px;
        font-weight: bold;
        border-bottom: 1px solid #000;
        padding: 2px 4px; /* Réduit */
        margin-bottom: 6px; /* Réduit */
        flex-shrink: 0;
      }

      /* ==================== SECTION PRINCIPALE ==================== */
      .main-section {
        display: flex;
        gap: 10px; /* Réduit */
        margin-bottom: 6px; /* Réduit */
        flex-shrink: 0;
      }

      .left-column {
        flex: 1;
      }
      .right-column {
        width: 260px; /* Réduit */
        flex-shrink: 0;
      }

      .info-row {
        display: flex;
        margin-bottom: 4px; /* Réduit */
        align-items: flex-start;
      }

      .info-label {
        width: 120px; /* Réduit */
        font-style: italic;
        font-weight: bold;
        flex-shrink: 0;
      }

      .info-separator {
        width: 12px; /* Réduit */
        text-align: center;
        flex-shrink: 0;
      }

      .info-value {
        flex: 1;
        min-height: 16px; /* Réduit */
        font-weight: normal;
        padding-left: 2px;
      }

      .info-value.underline {
        border-bottom: 1px solid #000;
        font-weight: normal;
      }

      .beneficiaire-box {
        height: 30px; /* Réduit */
      }

      /* ==================== TABLEAU VALIDATION ==================== */
      .validation-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 6px; /* Réduit */
        font-size: 9px; /* Réduit */
      }

      .validation-table th,
      .validation-table td {
        border: 1px solid #000;
        padding: 2px 4px; /* Réduit */
      }

      .validation-table th {
        font-weight: bold;
        text-transform: uppercase;
        font-size: 8px; /* Réduit */
        text-align: left;
      }

      .validation-table th.right,
      .validation-table td.right {
        text-align: right;
      }

      .arrete-sum {
        font-size: 8px; /* Réduit */
        font-style: italic;
        margin-top: 4px;
        padding: 3px; /* Réduit */
        border: 1px solid #000;
        line-height: 1.3;
      }

      /* ==================== TABLEAU PRINCIPAL ==================== */
      .main-table-container {
        margin-top: 6px; /* Réduit */
        margin-bottom: 6px; /* Réduit */
        flex-shrink: 0;
      }

      .main-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 9px; /* Réduit */
      }

      .main-table th,
      .main-table td {
        border: 1px solid #000;
        padding: 3px 5px; /* Réduit */
      }

      .main-table th {
        font-weight: bold;
        text-transform: uppercase;
        font-size: 8px; /* Réduit */
        background: #f5f5f5;
        text-align: center;
      }

      .main-table th.right,
      .main-table td.right {
        text-align: right;
      }

      .main-table th.center,
      .main-table td.center {
        text-align: center;
      }

      .main-table tbody tr {
        height: 20px; /* Réduit */
      }

      /* ==================== TOTAL OPERATION & COMMENTAIRE ==================== */
      .total-operation {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid #000;
        padding: 4px 8px; /* Réduit */
        margin-bottom: 6px; /* Réduit */
        flex-shrink: 0;
      }

      .total-label {
        font-size: 11px; /* Réduit */
        font-weight: bold;
        font-style: italic;
      }

      .total-amount {
        font-size: 14px; /* Réduit */
        font-weight: bold;
        font-family: "Courier New", monospace;
      }

      .comment-row {
        display: flex;
        align-items: stretch; /* Étire les enfants en hauteur */
        margin-bottom: 10px;
      }

      .comment-value {
        flex: 1;
        border: 1px solid #000; /* Cadre complet pour bien délimiter la zone */
        padding: 4px 6px;
        font-size: 9px;
        font-style: italic;
        min-height: 50px; /* Hauteur minimale pour que ce ne soit pas juste un trait si vide */
        height: auto; /* La hauteur s'adapte automatiquement au contenu */
        word-wrap: break-word; /* Empêche les mots longs de dépasser */
        white-space: pre-wrap; /* Conserve les sauts de ligne s'il y en a */
      }

      .comment-box {
        border: 1px solid #000;
        padding: 6px; /* Réduit */
        margin-bottom: 10px; /* Réduit */
        flex-shrink: 0;
      }

      .comment-title {
        font-weight: bold;
        font-size: 9px; /* Réduit */
        margin-bottom: 3px;
        text-transform: uppercase;
      }

      .comment-content {
        font-size: 9px; /* Réduit */
        min-height: 18px;
        font-style: italic;
      }

      /* ==================== SECTION BAS (SIGNATURES) ==================== */
      .bottom-section {
        display: flex;
        gap: 6px; /* Réduit */
        margin-top: auto;
        margin-bottom: 2mm; /* Réduit au minimum avant le pied de page */
        flex-shrink: 0;
      }

      .bottom-box {
        flex: 1;
        border: 1px solid #000;
        min-height: 200px;
        padding: 4px; /* Réduit : espace interne de la case plus fin */
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .bottom-box-title {
        font-weight: bold;
        text-transform: uppercase;
        font-size: 10px; /* Réduit */
        margin-bottom: 6px;
        text-align: center;
      }

      .bottom-box-signature {
        font-size: 9px; /* Réduit */
        text-align: center;
      }

      .stamp-box {
        height: 60px; /* Réduit */
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8px; /* Réduit */
        text-align: center;
        padding: 4px;
      }

      .authorization-box {
        font-size: 8px;
        min-height: 140px; /* ÉLARGI : de 110px à 140px */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .qr-code-container {
        text-align: center;
        margin-top: auto;
        padding-top: 6px;
      }

      .qr-code-image {
        width: 50px; /* Réduit */
        height: 50px; /* Réduit */
        display: block;
        margin: 0 auto;
        border: 1px solid #ccc;
      }

      .qr-code-text {
        font-size: 6px; /* Réduit */
        color: #000;
        margin-top: 2px;
        font-weight: bold;
        text-transform: uppercase;
      }

      .authorization-title {
        font-weight: bold;
        text-align: center;
        margin-bottom: 6px;
        font-size: 10px;
      }

      .auth-line {
        min-height: 14px; /* Réduit */
        padding: 1px 0;
      }

      .stamp-placeholder {
        border: 1px solid #000;
        width: 45px; /* Réduit */
        height: 45px; /* Réduit */
        margin-top: auto;
        margin-left: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 6px; /* Réduit */
      }

      .recu-sum-box {
        min-height: 140px; /* ÉLARGI : de 110px à 140px */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .recu-sum-title {
        font-weight: bold;
        font-size: 10px; /* Réduit */
        margin-bottom: 10px;
        text-align: center;
      }

      .recu-sum-content {
        font-size: 8px; /* Réduit */
        margin-bottom: 20px;
        line-height: 1.4;
      }

      .signature-line {
        border-top: 1px solid #000;
        margin-top: 25px; /* Réduit */
        padding-top: 2px;
        font-size: 8px; /* Réduit */
        text-align: center;
        font-weight: bold;
      }

      /* ==================== BANDE VERTICALE ==================== */
      .vertical-band {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 24px; /* Réduit */
        border: 1px solid #000;
        border-right: none;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8px; /* Réduit */
        font-weight: bold;
        text-transform: uppercase;
        text-align: center;
        padding: 4px;
        background: #fff;
        height: 100px; /* Réduit */
      }

      /* ==================== PIED DE PAGE ==================== */
      .footer {
        text-align: center;
        font-size: 8px;
        font-style: italic;
        border-top: 1px solid #000;
        padding-top: 3px; /* Réduit */
        margin-top: 3px; /* Réduit */
        flex-shrink: 0;
      }

      .beneficiaire-footer {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-top: 6px; /* Réduit */
        font-size: 10px; /* Réduit */
        flex-shrink: 0;
      }

      .beneficiaire-footer .info-label {
        width: auto;
        margin-right: 4px;
        font-style: italic;
        font-weight: bold;
      }

      .beneficiaire-footer .info-value {
        border-bottom: 1px solid #000;
        min-width: 130px; /* Réduit */
        text-align: left;
        padding-left: 4px;
      }

      /* ==================== PRINT ==================== */
      @media print {
        body {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .page {
          box-shadow: none;
          margin: 0;
          /* CORRECTION : aligné avec le padding normal (était 10mm 12mm avant) */
          padding: 5mm 8mm;
          border: 1px solid #000;
          height: 297mm;
        }
      }

      /* ==================== COPY SEPARATOR ==================== */
      .copy-separator {
        border: none;
        border-top: 2px dashed #000; /* Réduit */
        margin: 15px 0; /* Réduit */
        position: relative;
        text-align: center;
      }

      .copy-separator span {
        position: absolute;
        top: -10px; /* Réduit */
        left: 50%;
        transform: translateX(-50%);
        background: white;
        padding: 0 10px; /* Réduit */
        font-size: 10px; /* Réduit */
        font-weight: bold;
        text-transform: uppercase;
      }
    </style>
  </head>

  <body>
    {{tickets}}
  </body>
</html>
