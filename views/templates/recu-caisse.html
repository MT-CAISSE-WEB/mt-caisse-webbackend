<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Reçu de caisse</title>

<style>
    body {
        font-family: Arial, sans-serif;
        font-size: 11px;
    }

    .page {
        width: 100mm;
        margin: auto;
    }

    .ticket {
        width: 80mm;
        margin: 0 auto 10px auto;
        page-break-inside: avoid;
    }

    .separator {
        border-top: 1px dashed #000;
        margin: 10px 0;
    }

    .center { text-align: center; }
    .right  { text-align: right; }
    .bold   { font-weight: bold; }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 3px 0;
        font-size: 10.5px;
    }

    th {
        border-bottom: 1px solid #000;
        text-align: left;
    }

    .line {
        border-top: 1px dashed #000;
        margin: 8px 0;
    }

    .small {
        font-size: 10px;
    }
</style>
</head>

<body>
    <div class="page">
        {{tickets}}
    </div>
</body>
</html>
