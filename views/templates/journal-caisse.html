<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LIVRE DE CAISSE</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-size:10px;
            margin:12px;
            color:#000;
        }

        /* ENTETE PRINCIPAL */
        .main-header{
            border:1px solid #000;
            padding:15px;
            margin-bottom:5px;
        }

        .header-table{
            width:100%;
        }

        .header-table td{
            border:none;
            vertical-align:middle;
        }

        .company{
            font-size:12px;
            font-weight:bold;
        }

        .title{
            text-align:center;
        }

        .title h1{
            margin:0;
            font-size:28px;
            font-weight:bold;
        }

        .title .journal{
            margin-top:5px;
            font-size:12px;
            font-weight:bold;
        }

        .period{
            text-align:right;
            font-size:10px;
            font-weight:bold;
        }

        .center{
            text-align:center;
        }

        .right{
            text-align:right;
        }

        .bold{
            font-weight:bold;
        }

        .info{
            text-align:center;
            padding:10px;
        }

        /* TABLEAU */
        table.mouvements{
            width:100%;
            border-collapse:collapse;
            margin-bottom:10px;
        }

        table.mouvements th{
            background:#b9c7e6;
            border:1px solid #7f8fb2;
            padding:8px;
            font-size:12px;
            font-weight:normal;
            text-align:center;
        }

        table.mouvements td{
            border:1px solid #999;
            padding:6px;
            font-size:10px;
        }

        .titre-caisse td{
            padding:8px 12px;
        }

        .entete-caisse{
            display:flex;
            justify-content:space-between;
            align-items:center;
            width:100%;
            gap:20px;
            font-size:12px;
        }

        .caisse{
            flex:1;
            text-align:left;
        }

        .solde{
            text-align:right;
            white-space:nowrap;
        }

        .caisse strong,
        .solde strong{
            font-weight:bold;
        }


        .entete th{
            text-align:center;
            font-weight:bold;
        }

        .ligne-solde td{
            font-weight:bold;
        }

        /* Footer */
        .footer{
            text-align:right;
            font-size:10px;
            margin-top:10px;
        }
    </style>
</head>

<body>

<!-- ENTETE -->
<div class="main-header">
    <table class="header-table">
        <tr>
            <td width="25%" class="company">{{societe}}</td>
            <td width="50%" class="title"><h1>JOURNAL DE CAISSE</h1></td>
            <td width="25%" class="period">Période du {{datedebut}} au {{datefin}}</td>
        </tr>
    </table>
</div>

<!-- Ligne informations -->
<div class="info">
    Imprimé le {{dateimp}} à {{heureimp}} par {{utilisateur}}
</div>

<!-- Tableau -->
{{lignes}}


<!-- FOOTER -->
 <footer>
    <div style="text-align:right; font-size:8px; margin-top:10px;">
        MTWebCash - v0.0.2
    </div>
</footer>

</body>
</html>
